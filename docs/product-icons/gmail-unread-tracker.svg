<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Gmail Unread Tracker Icon Unread On</title>
  <desc id="desc">Gmail style envelope with a red status badge for unread mail.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e9eef5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#111827" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#bg)"/>

  <g filter="url(#shadow)">
    <rect x="20" y="30" width="88" height="64" rx="11" fill="#ffffff" stroke="#d1d5db" stroke-width="2.5"/>

    <path d="M24 34L64 65L104 34" fill="none" stroke="#ea4335" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M24 90V34" fill="none" stroke="#ea4335" stroke-width="7" stroke-linecap="round"/>
    <path d="M104 90V34" fill="none" stroke="#ea4335" stroke-width="7" stroke-linecap="round"/>

    <path d="M24 90L54 62" fill="none" stroke="#e5e7eb" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M104 90L74 62" fill="none" stroke="#e5e7eb" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <circle cx="93" cy="35" r="16" fill="#ea4335" stroke="#ffffff" stroke-width="4"/>
</svg>
